# ── GLP Activation Steering (消融与定向控制向量) ───────────────────────────
# 同时注册 Matt Suiche 两套官方控制向量（共占用约 1.3 MB 显存）：
# 1) GLP-27: Spec v3 双挂钩 (Attention o_proj + HC residual fold)，alpha=3.5，L11-L37
# 2) GLP-39: Spec v2 单挂钩 (Residual stream fold)，alpha=0.75，L1-L39
#
# 控制开关 1：默认启用状态 (1 = 默认开启消融, 0 = 默认关闭基线)
MYDS_STEER_ENABLE=0
# 控制开关 2：加载的控制向量路径 (默认同时载入 GLP-27 和 GLP-39，首个为默认生效项)
MYDS_STEER_PATH=/Users/fangqingyuan/.lmstudio/models/msuiche/glp.deepseek-v41-flash-1017-GLP-27-L11-37-a3.5.gguf,/Users/fangqingyuan/.lmstudio/models/msuiche/glp.deepseek-v41-flash-1017-GLP-39-L1-39-a0.75.gguf
# 控制开关 3：强度倍率。两种写法：
#   "3.5"                    单个值 => 所有 profile 共用（旧行为）
#   "glp27:1.0,glp39:0.75"   分 profile；未列出者用向量文件内置默认
#   "-1.0"                   全部用文件内置默认
# ★ 默认值取实测验证过的点（账本 §135–§137，本机 Q2 权重）：
#   glp39=0.75、glp27=1.0。glp27 用文件默认的 3.5 是 350% 过减，
#   会在 3/25 条上严重循环退化并波及良性题。
#   请求里给 steer_alpha 仍可逐次覆盖。
MYDS_STEER_ALPHA=glp27:1.0,glp39:0.75
# 控制开关 4：模式 (auto 自动识别 v2 或 v3)
MYDS_STEER_MODE=auto

# ── 非 0-ULP 实验开关（2026-10-25）─────────────────────────────
# ★ 完整清单、实测数据与质量判据见 docs/CORRECTNESS_STATUS.md
# 那里的每一条结论都有实测支撑，不要只读本文件的注释就开开关。
#
# 1 = 开启 YoCo Compact：consumer 层（21..39）跳过末尾 keep 之前的块。
#     ★ 这是【近似】，不是等价变换。默认 0 = 生产绝对 0-ULP 基线。
#     开启后：窗口前 127 个 token 仅预热（输出不精确），
#     decode 第 1 步也在预热区内 ⇒ 长文末尾质量会退化。
#
#   实测（账本 §98，同 prompt 单请求 --temp 0）：
#     · 速度：5.9K −20.1% / 25K −12.2% / 55K −6.8%（上下文越长收益越小）
#     · 质量：大海捞针探针（18,920 tok）【答对】，与基线一致
#       （截断的是 consumer 层计算范围，Layer 20 仍产全序列压缩 KV）
#     · 四臂审计 testcase34：思考+非0-ULP 得分最高（8.6），非思考+非0-ULP 最低（7.7）
#   ⇒ 可用，但建议搭配 thinking on。
MYDS_YOCO_COMPACT=0
# 保留区长度。必须 >= 255（128 窗口 + 127 预热）且为 512 的倍数
# （V41_SNAP_STRIDE，否则前缀快照点发布不出来）。程序会自动夹取/对齐。
MYDS_YOCO_KEEP_TOKENS=512
#
# ⛔ 绝对不要在这里加 MYDS_INDEXER_KEY_WINDOW。
#   它看似更快（55K −15%），实际是【静默造假】的有力来源：
#     同一个大海捞针探针：window=512 → 无法确定；window=4096 → 编了「张伟」；window=8192 → 无法填写
#     而基线/YOCO 都答对。窗口不是“调大就安全”：只要 needle 在窗口外就必然失败，
#     大小只决定“编”还是“认”。详见账本 §98 与 src/myds_v41_gpu.c 的注释。

