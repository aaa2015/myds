# ── KV 落盘（2026-11-02）────────────────────────────────────────────
# 两套缓存的持久化那一套：
#   · system prompt 锚点（kvanchor-*.bin）—— 工具集/系统提示词不变时可跨重启稳定命中
#   · 低位区 prompt 快照（kvlow/kvsegments/kvends）—— 按位置存，供任意前缀续跑
# 之前这一个多月【从未启用】（MYDS_KV_DSK 未设 ⇒ src/myds_engine.c 直接跳过），
# 所以每次重启后第一轮长系统提示词都要重跑十几秒 prefill。
# 容量：21 位置 × 3 way × 10 MiB ≈ 0.62 GiB，留 8 GiB 预算足够宽裕。
# 撤销：注释掉 MYDS_KV_DSK 这一行并重启。
# bench 口径：关闭磁盘 KV，避免每请求写 GB 级快照把落盘时间混进墙钟
MYDS_KV_DSK_BUDGET_MB=102400
MYDS_KV_DSK_WAYS=16

